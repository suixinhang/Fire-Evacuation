<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edit Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

<style>
  body { user-select: none; }
  canvas { background: #fff; border: 1px solid #ccc; }
  .menu-list li { display:flex; align-items:center; margin-bottom:3px; }
  .menu-list li a { flex-grow:1; cursor:pointer; }
</style>
</head>
<body>

<section class="section">
<div class="container is-fluid">

  <div class="mb-3 is-flex is-align-items-center">
    <h1 class="title is-4 mr-2" id="map-title">Untitled Map</h1>
    <button class="button is-small is-light" onclick="openTitleModal()">✏️</button>
  </div>

  <div class="columns">
    <div class="column is-3">
      <aside class="menu">
        <button class="button is-success is-fullwidth mb-2" onclick="submitMap()">Save Map</button>
        <p class="menu-label">Floors</p>
        <ul class="menu-list" id="floor-list"></ul>
      </aside>
      <button class="button is-fullwidth is-link is-outlined mt-3"
        onclick="openFloorModal()">+ Add Floor</button>
    </div>

    <div class="column is-9">
      <div style="overflow:auto; max-height:80vh; border:1px solid #ddd;">
        <canvas id="grid"></canvas>
      </div>
    </div>
  </div>
</div>
</section>

<!-- Context Menu -->
<div id="context-menu" class="dropdown is-active"
     style="position:absolute; display:none; z-index:100;">
  <div class="dropdown-menu">
    <div class="dropdown-content" id="context-items"></div>
  </div>
</div>

<script>
/* ================== CONSTANTS ================== */
const POINT_TYPES = [
  { type: "", name: "Blank", color: "#ffffff" },
  { type: "wall", name: "Wall", color: "#333" },
  { type: "responder", name: "Responder", color: "#3273dc" },
  { type: "occupant", name: "Occupant", color: "#fa6500" },
  { type: "stair", name: "Stair", color: "#23d160" },
  { type: "startpoint", name: "Start Point", color: "#ffd700" },
  { type: "window", name: "Window", color: "#90dcfe" },
  { type: "fire_origin", name: "Fire_origin", color : "#ffb6c1"},
  { type: "entrance", name: "Entrance", color : "#3273dc"},
  { type: "door", name: "Door", color : "#f642c1"}
];

const GRID_COUNT = 50;

const mapData = { title:"Untitled Map", floors:[], id:"" };
let currentFloor = null;

let isSelecting = false;
let selectStart = null;
let selectEnd = null;

/* ================== GRID ================== */
const canvas=document.getElementById("grid");
const ctx=canvas.getContext("2d");
const size=25;

canvas.width = GRID_COUNT * size;
canvas.height = GRID_COUNT * size;

/* ================== 工具 ================== */
function getBrightness(hex){
  if(!hex) return 255;
  const c = hex.substring(1);
  const rgb = parseInt(c,16);
  const r = (rgb>>16)&255;
  const g = (rgb>>8)&255;
  const b = rgb&255;
  return (r*299 + g*587 + b*114)/1000;
}

function setCell(x,y,data){
  if(!currentFloor) return;

  const idx=currentFloor.points.findIndex(p=>p.x===x&&p.y===y);

  let existing = {};
  if(idx>=0){
    existing = currentFloor.points[idx];
    currentFloor.points.splice(idx,1);
  }

  const cell = {
    x,
    y,
    type: data.type ?? existing.type ?? null,
    color: data.color ?? existing.color ?? null,
    weight: data.weight ?? existing.weight ?? 0,
    fire_weight: data.fire_weight ?? existing.fire_weight ?? 0
  };

  if(cell.weight===0 && cell.fire_weight===0 && !cell.type) return;

  currentFloor.points.push(cell);
}

function openTitleModal(){
  const name = prompt("Map name:", mapData.title);
  if(name === null) return;

  mapData.title = name;
  document.getElementById("map-title").textContent = name;
}

/* ================== DRAW ================== */
function drawGrid(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.strokeStyle="#eee";

  for(let x=0;x<=GRID_COUNT;x++){
    let px=x*size;
    ctx.beginPath();
    ctx.moveTo(px,0);
    ctx.lineTo(px,canvas.height);
    ctx.stroke();
  }

  for(let y=0;y<=GRID_COUNT;y++){
    let py=y*size;
    ctx.beginPath();
    ctx.moveTo(0,py);
    ctx.lineTo(canvas.width,py);
    ctx.stroke();
  }

  if(!currentFloor) return;

  currentFloor.points.forEach(p=>{
    if(p.type){
      ctx.fillStyle=p.color||"#000";
      ctx.fillRect(p.x*size,p.y*size,size,size);
    }

    const bg = p.color || "#ffffff";
    const isDark = getBrightness(bg) < 128;

    /* ===== 普通权重 ===== */
    if(p.weight && p.weight !== 0){
      ctx.fillStyle = isDark ? "#fff" : "#000";
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.font="10px sans-serif";

      ctx.fillText(
        p.weight,
        p.x*size + size/2,
        p.y*size + size/2 - 5
      );
    }

    /* ===== 火源权重 ===== */
    if(p.fire_weight && p.fire_weight !== 0){
      ctx.fillStyle = "#ff0000";
      ctx.textAlign="center";
      ctx.textBaseline="middle";
      ctx.font="10px sans-serif";

      ctx.fillText(
        p.fire_weight,
        p.x*size + size/2,
        p.y*size + size/2 + 5
      );
    }
  });

  if(selectStart && selectEnd){
  const minX = Math.min(selectStart.x, selectEnd.x);
  const maxX = Math.max(selectStart.x, selectEnd.x);
  const minY = Math.min(selectStart.y, selectEnd.y);
  const maxY = Math.max(selectStart.y, selectEnd.y);

  ctx.fillStyle = "rgba(50,115,220,0.2)";
  ctx.fillRect(
    minX*size,
    minY*size,
    (maxX-minX+1)*size,
    (maxY-minY+1)*size
  );

  ctx.strokeStyle = "#3273dc";
  ctx.strokeRect(
    minX*size,
    minY*size,
    (maxX-minX+1)*size,
    (maxY-minY+1)*size
  );
}
}

function getSelectedCells(){
  if(!selectStart || !selectEnd) return [];

  const cells = [];

  const minX = Math.min(selectStart.x, selectEnd.x);
  const maxX = Math.max(selectStart.x, selectEnd.x);
  const minY = Math.min(selectStart.y, selectEnd.y);
  const maxY = Math.max(selectStart.y, selectEnd.y);

  for(let x=minX; x<=maxX; x++){
    for(let y=minY; y<=maxY; y++){
      cells.push({x,y});
    }
  }

  return cells;
}

/* ================== FLOORS ================== */
function renderFloors(){
  const ul=document.getElementById("floor-list");
  ul.innerHTML="";
  mapData.floors.forEach((f,i)=>{
    const li=document.createElement("li");
    const a=document.createElement("a");
    a.textContent=f.name;

    if(f===currentFloor) a.classList.add("is-active");

    a.onclick=()=>{
      currentFloor=f;
      renderFloors();
      drawGrid();
    };

    const del=document.createElement("button");
    del.className="button is-small is-danger ml-2";
    del.textContent="×";
    del.onclick=e=>{
      e.stopPropagation();
      mapData.floors.splice(i,1);
      if(currentFloor===f) currentFloor=null;
      renderFloors();
      drawGrid();
    };

    li.append(a,del);
    ul.appendChild(li);
  });
}

function openFloorModal(){
  const name = prompt("Floor name:");
  if(!name) return;

  const f = { name, points: [] };
  mapData.floors.push(f);
  currentFloor = f;

  renderFloors();
  drawGrid();
}

/* ================== PAINT ================== */
canvas.addEventListener("mousedown", e=>{
  if(e.button !== 0 || !currentFloor) return;

  isSelecting = true;

  selectStart = {
    x: Math.floor(e.offsetX / size),
    y: Math.floor(e.offsetY / size)
  };

  selectEnd = {...selectStart};
});

canvas.addEventListener("mousemove", e=>{
  if(!isSelecting) return;

  selectEnd = {
    x: Math.floor(e.offsetX / size),
    y: Math.floor(e.offsetY / size)
  };

  drawGrid();
});

canvas.addEventListener("mouseup", ()=>{
  isSelecting = false;
});

/* ================== CLICK ================== */
canvas.addEventListener("click",e=>{
  if(isPainting||!currentFloor) return;

  const x=Math.floor(e.offsetX/size);
  const y=Math.floor(e.offsetY/size);

  const existing=currentFloor.points.find(p=>p.x===x&&p.y===y);

  if(existing){
    setCell(x,y,{
      type:null,
      weight:existing.weight,
      fire_weight: existing.fire_weight
    });
  }else{
    setCell(x,y,{type:"wall",color:"#333",weight:0});
  }

  drawGrid();
});

document.addEventListener("keydown", e=>{
  if(e.key === "Escape"){
    selectStart = null;
    selectEnd = null;
    drawGrid();
  }
});

/* ================== CONTEXT MENU ================== */
const menu=document.getElementById("context-menu");
const menuItems=document.getElementById("context-items");

document.addEventListener("click",()=>menu.style.display="none");

canvas.addEventListener("contextmenu", e=>{
  e.preventDefault();
  if(!currentFloor) return;

  const x = Math.floor(e.offsetX / size);
  const y = Math.floor(e.offsetY / size);

  const hasSelection = selectStart && selectEnd;
  const cells = hasSelection ? getSelectedCells() : [{x,y}];

  menuItems.innerHTML = "";

  POINT_TYPES.forEach(t=>{
    const a = document.createElement("a");
    a.className = "dropdown-item";

    a.innerHTML = `
      <span style="
        display:inline-block;
        width:14px;
        height:14px;
        background:${t.color};
        margin-right:8px;
        border:1px solid #ccc;
      "></span>
      ${t.name}
    `;

    a.onclick = ()=>{
      cells.forEach(c=>{
        const existing = currentFloor.points.find(p=>p.x===c.x && p.y===c.y);

        setCell(c.x, c.y, {
          type: t.type,
          color: t.color,
          weight: existing?.weight || 0,
          fire_weight: existing?.fire_weight || 0
        });
      });

      menu.style.display="none";
      drawGrid();
    };

    menuItems.appendChild(a);
  });

  // ===== 批量改权重 =====
  const weightItem = document.createElement("a");
  weightItem.className = "dropdown-item";
  weightItem.textContent = "Edit Weight";

  weightItem.onclick = ()=>{
    const val = prompt("Weight:");
    if(val === null) return;

    const w = parseFloat(val) || 0;

    cells.forEach(c=>{
      const existing = currentFloor.points.find(p=>p.x===c.x && p.y===c.y);

      setCell(c.x, c.y, {
        type: existing?.type || null,
        color: existing?.color || null,
        weight: w,
        fire_weight: existing?.fire_weight || 0
      });
    });

    menu.style.display="none";
    drawGrid();
  };

  menuItems.appendChild(weightItem);

  const fireWeightItem = document.createElement("a");
  fireWeightItem.className = "dropdown-item";
  fireWeightItem.textContent = "Edit Fire Weight";

  fireWeightItem.onclick = ()=>{
    const val = prompt("Fire Weight:");
    if(val === null) return;

    const w = parseFloat(val) || 0;

    cells.forEach(c=>{
      const existing = currentFloor.points.find(p=>p.x===c.x && p.y===c.y);

      setCell(c.x, c.y, {
        type: existing?.type || null,
        color: existing?.color || null,
        weight: existing?.weight || 0,
        fire_weight: w   // 🔥 核心
      });
    });

    menu.style.display="none";
    drawGrid();
  };

  menuItems.appendChild(fireWeightItem);

  menu.style.left = e.pageX+"px";
  menu.style.top = e.pageY+"px";
  menu.style.display = "block";
});

/* ================== SUBMIT ================== */
function submitMap(){
  fetch("/edit_map/",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(mapData)
  }).then(()=>location.href="/");
}

/* ================== LOAD ================== */
document.addEventListener("DOMContentLoaded",()=>{
  const id=new URLSearchParams(location.search).get("id");
  if(id) loadMap(id);
});

function loadMap(id){
  fetch(`/api/get_map_data/?id=${id}`)
    .then(r=>r.json())
    .then(tmp=>{
      let floorsData = tmp.data;

      if(typeof floorsData === "string"){
        try { floorsData = JSON.parse(floorsData); }
        catch{ floorsData = []; }
      }

      if(!Array.isArray(floorsData)){
        floorsData = [floorsData];
      }

      mapData.title = tmp.title;
      mapData.id = tmp.id;

      mapData.floors = floorsData.map(f=>({
        name: f.name,
        points: (f.points||[]).map(p=>({
          x:p.x,
          y:p.y,
          type:p.type||null,
          color:p.color||null,
          weight:p.weight||0,
          fire_weight:p.fire_weight||0
        }))
      }));

      currentFloor = mapData.floors[0] || null;

      document.getElementById("map-title").textContent = mapData.title;

      renderFloors();
      drawGrid();
    });
}
</script>

</body>
</html>
