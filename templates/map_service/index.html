<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Map Runtime Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

<style>
  body { background: #f5f5f5; }
  canvas { background: #fff; border: 1px solid #ccc; }
  .legend-box {
    background: #fff;
    border: 1px solid #ddd;
    padding: 12px;
    border-radius: 6px;
  }
  .legend-item {
    display: flex;
    align-items: center;
    font-size: 14px;
    margin-bottom: 6px;
  }
  .legend-color {
    width: 18px;
    height: 18px;
    margin-right: 8px;
    border: 1px solid #999;
  }
</style>
</head>

<body>
<section class="section">
<div class="container is-fluid">
<div class="columns">

<div class="column is-9">

  <div class="level mb-3">
    <div class="level-left">

      <div class="level-item mr-3">
        <div class="select is-small">
          <select id="floorSelect"></select>
        </div>
      </div>

      <div class="level-item buttons">
        <button class="button is-small" onclick="setView('block_type')">Block Type</button>
        <button class="button is-small" onclick="setView('block_status')">Block Status</button>
        <button class="button is-small" onclick="setView('smoke_density')">Smoke</button>
      </div>

    </div>
  </div>

  <div style="overflow:auto; max-height:80vh;">
    <canvas id="canvas"></canvas>
  </div>
</div>

<div class="column is-3">
  <div class="legend-box">
    <p class="has-text-weight-semibold mb-2">Legend</p>
    <div id="legend"></div>
  </div>
</div>

</div>
</div>
</section>

<div id="tooltip"
     style="
       position: fixed;
       pointer-events: none;
       background: rgba(0,0,0,0.85);
       color: #fff;
       padding: 6px 8px;
       font-size: 12px;
       border-radius: 4px;
       display: none;
       z-index: 9999;
     ">
</div>

<script>
/* ================= 基础配置 ================= */

const GRID = 25;
const GRID_COUNT = 200;

const POINT_TYPES = [
  { type: "wall", name: "Wall", color: "#333" },
  { type: "responder", name: "Responder", color: "#3273dc" },
  { type: "occupant", name: "Occupant", color: "#fa6500" },
  { type: "stair", name: "Stair", color: "#23d160" },
  { type: "startpoint", name: "Start Point", color: "#ffd700" },
  { type: "window", name: "Window", color: "#90dcfe" }
];

const TYPE_MAP = {};
POINT_TYPES.forEach(p => TYPE_MAP[p.type] = p);

/* ================= DOM ================= */

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");
const legend = document.getElementById("legend");
const floorSelect = document.getElementById("floorSelect");

canvas.width  = GRID_COUNT * GRID;
canvas.height = GRID_COUNT * GRID;

/* ================= 状态 ================= */

let mapData = [];
let blockStatus = {};
let smokeDensity = {};

let currentFloor = null;
let viewMode = "block_type";

let minX = 0, minY = 0;

/* ================= 工具 ================= */

function smokeColor(v) {
    if (v === -1) return "#000000";

    const value = Math.max(0, Math.min(100, v));
    let r, g, b;

    if (value <= 50) {
        const ratio = value / 50;
        r = 0;
        g = Math.round(255 * ratio);
        b = Math.round(255 * (1 - ratio));
    } else {
        const ratio = (value - 50) / 50;
        r = Math.round(255 * ratio);
        g = Math.round(255 * (1 - ratio));
        b = 0;
    }

    return `rgb(${r},${g},${b})`;
}

function drawGrid() {
  ctx.strokeStyle = "#e6e6e6";

  for (let x = 0; x <= GRID_COUNT; x++) {
    let px = x * GRID;
    ctx.beginPath();
    ctx.moveTo(px, 0);
    ctx.lineTo(px, canvas.height);
    ctx.stroke();
  }

  for (let y = 0; y <= GRID_COUNT; y++) {
    let py = y * GRID;
    ctx.beginPath();
    ctx.moveTo(0, py);
    ctx.lineTo(canvas.width, py);
    ctx.stroke();
  }
}

/* ================= 图例 ================= */

function updateLegend() {
  legend.innerHTML = "";

  let items = [];

  if (viewMode === "block_type") {
    items = POINT_TYPES.map(p => [p.color, p.name]);
  }

  if (viewMode === "block_status") {
    items = [
      ["#23d160", "watched"],
      ["#fa6500", "unwatched"],
      ["#ffd324", "uncertain"],
      ["transparent", "null"]
    ];
  }

  if (viewMode === "smoke_density") {
    items = [
      ["#000000", "-1"],
      [smokeColor(0), "0"],
      [smokeColor(50), "50"],
      [smokeColor(100), "100"]
    ];
  }

  items.forEach(([color, text]) => {
    const row = document.createElement("div");
    row.className = "legend-item";

    const box = document.createElement("div");
    box.className = "legend-color";
    box.style.background = color;

    row.appendChild(box);
    row.appendChild(document.createTextNode(text));
    legend.appendChild(row);
  });
}

/* ================= 视图 ================= */

function setView(v) {
  viewMode = v;
  updateLegend();
  draw();
}

/* ================= 楼层 ================= */

floorSelect.onchange = () => {
  currentFloor = floorSelect.value;
  draw();
};

function updateFloorSelect() {
  floorSelect.innerHTML = "";
  mapData.forEach(f => {
    const opt = document.createElement("option");
    opt.value = f.name;
    opt.textContent = f.name;
    if (f.name === currentFloor) opt.selected = true;
    floorSelect.appendChild(opt);
  });
}

/* ================= 绘制 ================= */

function draw() {
  if (!currentFloor) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (viewMode === "block_type") {
    const floor = mapData.find(f => f.name === currentFloor);
    if (floor) {
      floor.points.forEach(p => {
        ctx.fillStyle = TYPE_MAP[p.type]?.color || "#999";
        ctx.fillRect(p.x * GRID, p.y * GRID, GRID, GRID);
      });
    }
  }

  if (viewMode === "block_status") {
    const s = blockStatus[currentFloor] || {};
    Object.entries(s).forEach(([key, val]) => {
      if (val === "null") return;

      if (val === "watched")   ctx.fillStyle = "#23d160";
      if (val === "unwatched") ctx.fillStyle = "#fa6500";
      if (val === "uncertain") ctx.fillStyle = "#ffd324";

      const [x,y] = key.split(",").map(Number);
      ctx.fillRect(x * GRID, y * GRID, GRID, GRID);
    });
  }

  if (viewMode === "smoke_density") {
    const d = smokeDensity[currentFloor] || {};
    Object.entries(d).forEach(([key, v]) => {
      const [x,y] = key.split(",").map(Number);
      ctx.fillStyle = smokeColor(v);
      ctx.fillRect(x * GRID, y * GRID, GRID, GRID);
    });
  }

  drawGrid();
}

/* ================= Tooltip ================= */

canvas.addEventListener("mousemove", e => {
  const rect = canvas.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;

  const x = Math.floor(cx / GRID);
  const y = Math.floor(cy / GRID);
  const key = `${x},${y}`;

  let text = `(${x}, ${y})`;

  if (viewMode === "block_type") {
    const floor = mapData.find(f => f.name === currentFloor);
    const point = floor?.points.find(p => p.x === x && p.y === y);
    if (!point) return tooltip.style.display = "none";
    text += `<br>Type: ${TYPE_MAP[point.type]?.name}`;
  }

  if (viewMode === "block_status") {
    text += `<br>Status: ${blockStatus[currentFloor]?.[key] ?? "null"}`;
  }

  if (viewMode === "smoke_density") {
    text += `<br>Smoke: ${smokeDensity[currentFloor]?.[key] ?? 0}`;
  }

  tooltip.innerHTML = text;
  tooltip.style.left = e.clientX + 12 + "px";
  tooltip.style.top = e.clientY + 12 + "px";
  tooltip.style.display = "block";
});

canvas.addEventListener("mouseleave", () => {
  tooltip.style.display = "none";
});

/* ================= 数据 ================= */

function fetchAll() {
  fetch("/api/block_type").then(r => r.json()).then(d => {
    mapData = d;
    if (!currentFloor && d.length) currentFloor = d[0].name;
    updateFloorSelect();
    draw();
  });

  fetch("/api/block_status").then(r => r.json()).then(d => {
    blockStatus = d;
    draw();
  });

  fetch("/api/smoke_density").then(r => r.json()).then(d => {
    smokeDensity = d;
    draw();
  });
}

updateLegend();
fetchAll();
setInterval(fetchAll, 1000);
</script>

</body>
</html>
