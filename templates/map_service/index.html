<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Map Runtime Viewer</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

<style>
body { background:#f5f5f5; }
canvas { background:#fff; border:1px solid #ccc; }

.legend-box{
  background:#fff;
  border:1px solid #ddd;
  padding:12px;
  border-radius:6px;
}

.legend-item{
  display:flex;
  align-items:center;
  font-size:14px;
  margin-bottom:6px;
}

.legend-color{
  width:18px;height:18px;
  margin-right:8px;
  border:1px solid #999;
}
</style>
</head>

<body>
<section class="section">
<div class="container is-fluid">
<div class="columns">

<!-- LEFT -->
<div class="column is-9">

  <div class="level mb-3">
    <div class="level-left">

      <div class="select is-small mr-3">
        <select id="floorSelect"></select>
      </div>

      <div class="buttons">
        <button class="button is-small" onclick="setView('block_type')">Block Type</button>
        <button class="button is-small" onclick="setView('block_status')">Block Status</button>
        <button class="button is-small" onclick="setView('smoke_density')">Smoke</button>
        <button class="button is-small" onclick="setView('probability')">Probability</button>
        <button class="button is-small" onclick="setView('fire_probability')">Fire Prob</button>
      </div>

    </div>
  </div>

  <div style="overflow:auto; max-height:80vh;">
    <canvas id="canvas"></canvas>
  </div>

</div>

<!-- RIGHT -->
<div class="column is-3">
  <div class="legend-box">
    <p class="has-text-weight-semibold mb-2">Legend</p>
    <div id="legend"></div>
  </div>

  <p style="font-size:xx-large;font-weight:bolder;">
    Time: <span id="timeshow"></span>
  </p>
</div>

</div>
</div>
</section>

<div id="tooltip"
style="
position:fixed;
pointer-events:none;
background:rgba(0,0,0,0.85);
color:#fff;
padding:6px 8px;
font-size:12px;
border-radius:4px;
display:none;
z-index:9999;">
</div>

<script>

const GRID = 25;
const GRID_COUNT = 200;

/* ================= colors ================= */
const POINT_TYPES = [
  { type: "wall", name: "Wall", color: "#333" },
  
  { type: "occupant", name: "Occupant", color: "#fa6500" },
  { type: "stair", name: "Stair", color: "#23d160" },
  { type: "startpoint", name: "Start Point", color: "#ffd700" },
  { type: "window", name: "Window", color: "#90dcfe" },
  { type: "fire_origin", name: "Fire_origin", color : "#ffb6c1"},
  { type: "entrance", name: "Entrance", color : "#3273dc"},
  { type: "door", name: "Door", color : "#f642c1"}
];

const TYPE_COLOR = {};
POINT_TYPES.forEach(p => TYPE_COLOR[p.type] = p.color);

/* ================= DOM ================= */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");
const legend = document.getElementById("legend");
const floorSelect = document.getElementById("floorSelect");
const timeshow = document.getElementById("timeshow");

canvas.width = GRID_COUNT * GRID;
canvas.height = GRID_COUNT * GRID;

/* ================= state ================= */
let mapData = [];
let blockStatus = {};
let smokeDensity = {};
let probabilityMap = {};
let fireProbabilityMap = {};
let fireWeightMap = {};
let visibilityMap = {};
let responders = {};
let activeTasks = {};

let currentFloor = null;
let viewMode = "block_type";

let hoverVisibleCells = [];
let hoveredResponderId = null;

/* ================= utils ================= */
function probColor(v){
  v = Math.max(0,Math.min(1,v||0));
  return `rgb(${255*v},0,${255*(1-v)})`;
}

function smokeColor(v,max){
  if (v === -1) return "#000";
  if (!max) return "#fff";
  let r = v/max;
  return `rgb(255,${255*(1-r)},0)`;
}

/* ================= legend ================= */
function updateLegend(){
  legend.innerHTML = "";

  let items = [];

  if(viewMode==="block_type"){
    items = POINT_TYPES.map(p=>[p.color,p.type]);
  }

  if(viewMode==="block_status"){
    items = [
      ["#23d160","watched"],
      ["#fa6500","unwatched"],
      ["#ffd324","uncertain"]
    ];
  }

  if(viewMode==="probability"){
    items = [[probColor(0),"0"],[probColor(1),"1"]];
  }

  if(viewMode==="smoke_density"){
    items = [["#000","wall"],["#fff","0"],["#ff0000","max"]];
  }

  // if(viewMode==="fire_probability"){
  //   const p = fireProbabilityMap[currentFloor] || {};
  //   const w = fireWeightMap[currentFloor] || {};

  //   for(let k in p){
  //     const [x,y]=k.split(",").map(Number);

  //     // 背景：概率颜色
  //     ctx.fillStyle = probColor(p[k]);
  //     ctx.fillRect(x*GRID,y*GRID,GRID,GRID);

  //     // ===== 数字：原始 fire_weight =====
  //     const val = w[k] ?? 0;

  //     if(val > 0){
  //       ctx.fillStyle = "#000";
  //       ctx.font = "10px monospace";
  //       ctx.textAlign = "center";
  //       ctx.textBaseline = "middle";

  //       ctx.fillText(
  //         val.toFixed(0),
  //         x*GRID + GRID/2,
  //         y*GRID + GRID/2
  //       );
  //     }
  //   }
  // }

  items.forEach(([c,t])=>{
    const row=document.createElement("div");
    row.className="legend-item";

    const box=document.createElement("div");
    box.className="legend-color";
    box.style.background=c;

    row.appendChild(box);
    row.appendChild(document.createTextNode(t));
    legend.appendChild(row);
  });
}

/* ================= draw ================= */
function draw(){
  if(!currentFloor) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const floor = mapData.find(f=>f.name===currentFloor);

  /* block_type */
  if(viewMode==="block_type"){
    floor?.points.forEach(p=>{
      if(!p.type) return;
      ctx.fillStyle = TYPE_COLOR[p.type] || "#999";
      ctx.fillRect(p.x*GRID,p.y*GRID,GRID,GRID);
    });
  }

  /* block_status */
  if(viewMode==="block_status"){
    const s = blockStatus[currentFloor] || {};
    for(let k in s){
      if(s[k]==="null") continue;
      const [x,y]=k.split(",").map(Number);

      ctx.fillStyle =
        s[k]==="watched"?"#23d160":
        s[k]==="unwatched"?"#fa6500":
        "#ffd324";

      ctx.fillRect(x*GRID,y*GRID,GRID,GRID);
    }
  }

  /* smoke */
  if(viewMode==="smoke_density"){
    const d = smokeDensity[currentFloor] || {};
    const max = Math.max(...Object.values(d),0);

    for(let k in d){
      const [x,y]=k.split(",").map(Number);
      ctx.fillStyle = smokeColor(d[k],max);
      ctx.fillRect(x*GRID,y*GRID,GRID,GRID);
    }
  }

  /* probability */
  if(viewMode==="probability"){
    const p = probabilityMap[currentFloor] || {};
    for(let k in p){
      const [x,y]=k.split(",").map(Number);
      ctx.fillStyle = probColor(p[k]);
      ctx.fillRect(x*GRID,y*GRID,GRID,GRID);
    }
  }

  /* fire probability + 原始权重 */
  if(viewMode==="fire_probability"){
    const p = fireProbabilityMap[currentFloor] || {};
    const w = fireWeightMap[currentFloor] || {};

    for(let k in p){
      const [x,y]=k.split(",").map(Number);

      // ===== 背景：概率 =====
      ctx.fillStyle = probColor(p[k]);
      ctx.fillRect(x*GRID,y*GRID,GRID,GRID);

      // ===== 数字：原始权重 =====
      const val = w[k] ?? 0;

      if(val > 0){
        ctx.fillStyle = "#000";

        // ⭐ 字体稍微大一点更清晰
        ctx.font = "bold 11px monospace";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        ctx.fillText(
          val.toFixed(0),
          x*GRID + GRID/2,
          y*GRID + GRID/2
        );
      }
    }
  }

  /* ===== responder target ===== */
  for (let rid in activeTasks) {
    const task = activeTasks[rid];
    const [tx, ty] = task.target;

    ctx.fillStyle = task.type === "rescue" ? "#ffffff" : "#00ffff";
    
    ctx.beginPath();
    ctx.arc(
      tx * GRID + GRID / 2,
      ty * GRID + GRID / 2,
      6.6,
      0,
      Math.PI * 2
    );
    ctx.fill();

    /* 轻微光晕 */
    // ctx.fillStyle = task.type === "rescue"
    //   ? "rgba(81, 154, 186,0.7)"
    //   : "rgba(35,209,96,0.7)";

    // ctx.beginPath();
    // ctx.arc(
    //   tx * GRID + GRID / 2,
    //   ty * GRID + GRID / 2,
    //   14,
    //   0,
    //   Math.PI * 2
    // );
    // ctx.fill();
  }

  /* responders sprite */
  const rmap = responders[currentFloor] || {};
  for(let rid in rmap){
    const [x,y] = rmap[rid];

    ctx.fillStyle="#3273dc";
    ctx.beginPath();
    ctx.arc(x*GRID+GRID/2,y*GRID+GRID/2,6,0,Math.PI*2);
    ctx.fill();
  }

  /* visibility shadow */
  if(hoverVisibleCells.length){
    ctx.fillStyle="rgba(50,115,220,0.22)";
    hoverVisibleCells.forEach(k=>{
      const [x,y]=k.split(",").map(Number);
      ctx.fillRect(x*GRID,y*GRID,GRID,GRID);
    });
  }

  drawGrid();
}

/* ================= grid ================= */
function drawGrid(){
  ctx.strokeStyle="#eee";

  for(let i=0;i<=GRID_COUNT;i++){
    ctx.beginPath();
    ctx.moveTo(i*GRID,0);
    ctx.lineTo(i*GRID,canvas.height);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(0,i*GRID);
    ctx.lineTo(canvas.width,i*GRID);
    ctx.stroke();
  }
}

/* ================= hover FIX ================= */
canvas.addEventListener("mousemove",e=>{
  const rect=canvas.getBoundingClientRect();
  const x=Math.floor((e.clientX-rect.left)/GRID);
  const y=Math.floor((e.clientY-rect.top)/GRID);
  const key=`${x},${y}`;

  const floor = mapData.find(f=>f.name===currentFloor);
  const point = floor?.points.find(p=>p.x===x&&p.y===y);

  hoveredResponderId = null;

  const rmap = responders[currentFloor] || {};

  for(let rid in rmap){
    const [rx,ry] = rmap[rid];
    if(rx===x && ry===y){
      hoveredResponderId = rid;
      break;
    }
  }

  /* visibility resolve */
  if(hoveredResponderId){
    hoverVisibleCells =
      visibilityMap[currentFloor]?.[hoveredResponderId] || [];
  } else {
    hoverVisibleCells = [];
  }

  if (hoveredResponderId && activeTasks[hoveredResponderId]) {
    const t = activeTasks[hoveredResponderId].target;

    // 目标点强化显示
    const key = `${t[0]},${t[1]}`;

    hoverVisibleCells = hoverVisibleCells.concat([key]);
  }

  let text=`(${x},${y})`;

  if(viewMode==="block_type" && point && point.type !== null){
    text += `<br>Type: ${point.type}`;
  }

  if(viewMode==="smoke_density"){
    text += `<br>Smoke: ${smokeDensity[currentFloor]?.[key] ?? 0}`;
  }

  if(viewMode==="probability"){
    text += `<br>P: ${probabilityMap[currentFloor]?.[key] ?? 0}`;
  }

  if(viewMode==="block_status"){
    text += `<br>Status: ${blockStatus[currentFloor]?.[key] ?? "null"}`;
  }

  if(viewMode==="fire_probability"){
    text += `<br>Fire P: ${fireProbabilityMap[currentFloor]?.[key] ?? 0}`;
    text += `<br>Weight: ${fireWeightMap[currentFloor]?.[key] ?? 0}`;
  }

  tooltip.innerHTML=text;
  tooltip.style.left=e.clientX+10+"px";
  tooltip.style.top=e.clientY+10+"px";
  tooltip.style.display="block";

  draw();
});

canvas.addEventListener("mouseleave",()=>{
  tooltip.style.display="none";
  hoverVisibleCells=[];
  draw();
});

/* ================= API ================= */
function fetchAll(){

  fetch("/api/block_type").then(r=>r.json()).then(d=>{
    mapData=d;
    if(!currentFloor && d.length) currentFloor=d[0].name;
    updateFloor();
  });

  fetch("/api/block_status").then(r=>r.json()).then(d=>blockStatus=d);
  fetch("/api/smoke_density").then(r=>r.json()).then(d=>smokeDensity=d);
  fetch("/api/probability_map").then(r=>r.json()).then(d=>probabilityMap=d);
  fetch("/api/responder_visibility").then(r=>r.json()).then(d=>visibilityMap=d);
  fetch("/api/responders").then(r=>r.json()).then(d=>responders=d);

  fetch("/api/get_time").then(r=>r.json()).then(d=>{
    timeshow.innerText=d.res.toFixed(2);
  });
  fetch("/api/active_tasks")
  .then(r => r.json())
  .then(d => activeTasks = d);
  fetch("/api/fire_probability_map")
  .then(r => r.json())
  .then(d => fireProbabilityMap = d);
  fetch("/api/fire_weight_map")
  .then(r => r.json())
  .then(d => fireWeightMap = d);

  draw();
}

/* ================= floor ================= */
function updateFloor(){
  floorSelect.innerHTML="";
  mapData.forEach(f=>{
    const opt=document.createElement("option");
    opt.value=f.name;
    opt.textContent=f.name;
    floorSelect.appendChild(opt);
  });
}

floorSelect.onchange=()=>{
  currentFloor=floorSelect.value;
  draw();
};

function setView(v){
  viewMode=v;
  updateLegend();
  draw();
}

updateLegend();
fetchAll();
setInterval(fetchAll,1000);

</script>

</body>
</html>
